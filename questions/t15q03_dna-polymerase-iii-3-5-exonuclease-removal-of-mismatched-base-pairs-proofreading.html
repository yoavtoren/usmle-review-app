eotides", "correct": false}, {"letter": "E", "text": "Unwinding of double-stranded DNA", "correct": false}], "eliminations": [{"letter": "A", "label": "Remove supercoils - DNA gyrase/topoisomerase", "detail": "WHAT IT IS: cleaving DNA to relieve supercoiling (DNA gyrase, a type II topoisomerase). ❌ WHY IT FAILS: that is topoisomerase activity, not a polymerase's 3'->5' exonuclease proofreading. ✅ Correct if: supercoil relief at the fork."}, {"letter": "B", "label": "Excise thymine dimers - nucleotide excision repair", "detail": "WHAT IT IS: removing UV-induced thymine (pyrimidine) dimers via a UV-specific endonuclease (nucleotide excision repair). ❌ WHY IT FAILS: this is a DNA-repair pathway, not the proofreading exonuclease of DNA polymerase III. ✅ Correct if: repair of pyrimidine dimers (xeroderma pigmentosum defect)."}, {"letter": "D", "label": "Remove RNA primer - DNA pol I 5'->3' exonuclease", "detail": "WHAT IT IS: excision of RNA primers, a UNIQUE function of DNA polymerase I via its 5'->3' exonuclease. ❌ WHY IT FAILS: that is 5'->3' (not 3'->5') exonuclease and is specific to Pol I, not the proofreading activity described. ✅ Correct if: DNA polymerase I removing/replacing RNA primers."}, {"letter": "E", "label": "Unwind DNA - helicase", "detail": "WHAT IT IS: separating the parental strands (helicase). ❌ WHY IT FAILS: unwinding is not an exonuclease activity and is not performed by DNA polymerase III. ✅ Correct if: strand separation at the origin/fork."}], "reasoning": ["3'->5' exonuclease activity of DNA polymerases is their proofreading function", "Proofreading removes an incorrectly incorporated (mismatched) nucleotide from the 3' end", "This maintains replication fidelity during DNA synthesis", "-> removal of mismatched base pairs; answer C"], "mechanism": "Prokaryotes have three DNA polymerases (I, II, III), all of which share two core activities: 5'->3' POLYMERASE activity (adding deoxynucleotides to the 3' end of a primer, extending the daughter strand) and 3'->5' EXONUCLEASE 'PROOFREADING' activity. As the daughter strand is synthesized, the polymerase checks that each newly added base is correctly paired with the template; if a MISMATCH occurs, the 3'->5' exonuclease removes the incorrect nucleotide (hydrolyzing the phosphodiester bond) so the correct complementary base can be added - greatly increasing REPLICATION FIDELITY. DNA polymerase III is the main REPLICATIVE polymerase (leading strand and Okazaki fragments); DNA polymerase I additionally has a UNIQUE 5'->3' EXONUCLEASE that removes RNA primers and replaces them with DNA. The distractors are other enzymes' jobs: topoisomerase/gyrase (supercoil relief), nucleotide excision repair (thymine-dimer removal), Pol I 5'->3' exonuclease (primer removal), and helicase (unwinding).", "difficulty": [{"key": "knowledge", "label": "🧠 Knowledge", "text": "First Aid Biochem > DNA replication: all prokaryotic DNA polymerases have 3'->5' exonuclease (proofreading, removes mismatches); DNA pol I uniquely has 5'->3' exonuclease (removes RNA primer); pol III = main replicative polymerase."}, {"key": "comprehension", "label": "📖 Comprehension", "text": "3'->5' exonuclease = proofreading = remove mismatched bases during synthesis."}, {"key": "vocab", "label": "🔤 Vocab", "text": "Unsure on 3'->5' vs 5'->3' exonuclease, proofreading, DNA pol I vs III, or RNA primer removal? Tell me which."}, {"key": "distractor", "label": "🨤 Distractor", "text": "Supercoils = gyrase; thymine dimers = excision repair; primer removal = Pol I 5'->3' exonuclease; unwinding = helicase."}, {"key": "other", "label": "🗒️ Other", "text": "Bank: 3'->5' exonuclease = proofreading (all pols); 5'->3' exonuclease = primer removal (Pol I only)."}], "keywords": [{"front": "3'->5' exonuclease activity", "back": "Proofreading (removes mismatched bases)"}, {"front": "5'->3' exonuclease activity", "back": "DNA polymerase I only (removes RNA primer)"}, {"front": "DNA polymerase III role", "back": "Main replicative  if(k==='comprehension')return '🧭 '+esc(q.strategy||'Re-read the stem; identify exactly what is being asked.');
 if(k==='vocab')return '🔤 Note the unfamiliar term(s) in the stem and define them; the highlighted clues explain the key ones.';
 if(k==='imaging')return '🖼️ Practice the image/diagram type; review First Aid: '+esc(fa)+'.';
 if(k==='distractor')return '🧲 Re-read the Eliminate tab — learn why each trap is wrong before choosing.';
 return '✍️ Note what happened (timing, second-guessing, careless click) and adjust next time.';
}
function wrongOpts(){return q.options.filter(function(o){return !o.correct;});}
function correctOpt(){return q.options.filter(function(o){return o.correct;})[0];}
function render(){
 var H='';
 H+='<div class="head"><div class="pills"><span class="pill">#'+esc(q.item)+'</span>';
 H+='<span class="pill ghost">'+esc(q.system)+'</span><span class="pill ghost">'+esc(q.topic)+'</span>';

 H+='</div><h2>'+esc(q.title)+'</h2></div>';
 H+='<div class="tabs">'+TABS.map(function(t){return '<button class="tab'+(s.tab===t[0]?' active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';

 if(s.tab==='q'){

 }

 if(s.tab==='e'){

   if(s.steps<q.reasoning.length)H+='<button class="chain-next" data-act="step">👆 Reveal step '+(s.steps+1)+'</button>';

 }

 if(s.tab==='k'){

 }

 if(s.tab==='f'){

 if(t.dataset.tab){s.tab=t.dataset.tab;}
